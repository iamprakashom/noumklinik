name: Run Vitest on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Run Vitest
        id: vitest
        run: npm run test -- --reporter=json --outputFile=vitest-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Generate PR test summary
        if: always() && hashFiles('vitest-results.json') != ''
        run: |
          node <<'EOF'
          const fs = require('fs');

          const report = JSON.parse(
            fs.readFileSync('vitest-results.json', 'utf8')
          );

          const success = report.success;

          let markdown = `## 🧪 Vitest Test Report

          | Metric | Value |
          |---|---:|
          | Status | ${success ? '✅ Passed' : '❌ Failed'} |
          | Test Suites | ${report.numPassedTestSuites}/${report.numTotalTestSuites} passed |
          | Tests | ${report.numTotalTests} |
          | Passed | ${report.numPassedTests} |
          | Failed | ${report.numFailedTests} |
          | Skipped | ${report.numPendingTests} |
          `;

          if (report.numFailedTests > 0) {
            markdown += `\n### ❌ Failed Tests\n\n`;
            for (const suite of report.testResults) {
              const file = suite.name.split('/').pop();
              for (const test of suite.assertionResults) {
                if (test.status === 'failed') {
                  markdown += `- \`${file}\` — ${test.fullName}\n`;
                }
              }
            }
          } else {
            markdown += `\n### ✅ All tests passed!\n`;
          }

          markdown += `\n---\n*Generated by GitHub Actions*`;

          fs.writeFileSync('vitest-summary.md', markdown);
          EOF

      - name: Comment on PR with test results
        if: always() && hashFiles('vitest-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: Test Results
          path: vitest-summary.md
