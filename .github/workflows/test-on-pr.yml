name: Run Bun Tests on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Bun Tests
        id: bun-test
        run: bun test --reporter=junit --reporter-outfile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-results
          path: test-results.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Generate PR test summary
        if: always() && hashFiles('test-results.xml') != ''
        run: |
          bun -e "
          const fs = require('fs');
          const xml = fs.readFileSync('test-results.xml', 'utf8');

          const testcaseRegex = /<testcase\s+([^>]+)>(?:([\s\S]*?)<\/testcase>)?|<testcase\s+([^>]+)\/>/g;
          const attrRegex = /(\w+)=\"([^\"]*)\"/g;

          let totalTests = 0;
          let passedTests = 0;
          let failedTests = 0;
          let skippedTests = 0;
          const failedList = [];
          const suiteSet = new Set();
          const passedSuiteSet = new Set();
          const failedSuiteSet = new Set();

          const suiteRegex = /<testsuite\s+([^>]+)>/g;
          let suiteMatch;
          while ((suiteMatch = suiteRegex.exec(xml)) !== null) {
            const attrs = {};
            let a;
            while ((a = attrRegex.exec(suiteMatch[1])) !== null) {
              attrs[a[1]] = a[2];
            }
            if (attrs.name) {
              suiteSet.add(attrs.name);
              const fails = parseInt(attrs.failures || '0', 10) + parseInt(attrs.errors || '0', 10);
              if (fails > 0) {
                failedSuiteSet.add(attrs.name);
              } else {
                passedSuiteSet.add(attrs.name);
              }
            }
          }

          let match;
          while ((match = testcaseRegex.exec(xml)) !== null) {
            totalTests++;
            const attrString = match[1] || match[3] || '';
            const body = match[2] || '';

            const attrs = {};
            let a;
            while ((a = attrRegex.exec(attrString)) !== null) {
              attrs[a[1]] = a[2];
            }

            const isFailed = body.includes('<failure') || body.includes('<error');
            const isSkipped = body.includes('<skipped');

            if (isFailed) {
              failedTests++;
              const name = attrs.name || 'Unnamed test';
              const classname = attrs.classname ? \`\${attrs.classname} > \` : '';
              failedList.push(\`\${classname}\${name}\`);
            } else if (isSkipped) {
              skippedTests++;
            } else {
              passedTests++;
            }
          }

          const success = failedTests === 0 && totalTests > 0;
          const numTotalSuites = suiteSet.size || 1;
          const numPassedTestSuites = passedSuiteSet.size;

          let markdown = \`## 🧪 Bun Test Report

          | Metric | Value |
          |---|---:|
          | Status | \${success ? '✅ Passed' : '❌ Failed'} |
          | Test Suites | \${numPassedTestSuites}/\${numTotalSuites} passed |
          | Tests | \${totalTests} |
          | Passed | \${passedTests} |
          | Failed | \${failedTests} |
          | Skipped | \${skippedTests} |
          \`;

          if (failedList.length > 0) {
            markdown += \`\\n### ❌ Failed Tests\\n\\n\`;
            for (const t of failedList) {
              markdown += \`- \\\`\${t}\\\`\\n\`;
            }
          } else {
            markdown += \`\\n### ✅ All tests passed!\\n\`;
          }

          markdown += \`\\n---\\n*Generated by GitHub Actions (Bun)*\`;

          fs.writeFileSync('test-summary.md', markdown);
          "

      - name: Comment on PR with test results
        if: always() && hashFiles('test-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: Test Results
          path: test-summary.md
